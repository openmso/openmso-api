//
// Vocabulary shared by the wire protocol and the plugin manifest. Kept
// separate so packaging tooling that reads manifests need not pull in the
// capture schema.

syntax = "proto3";

package omso.capture.v1;

message Empty {}

message Error {
  ErrorCode code = 1;
  string message = 2;
}

enum ErrorCode {
  ERROR_CODE_UNSPECIFIED = 0;
  ERROR_INVALID_REQUEST = 1;      // malformed, or wrong state for this request
  ERROR_UNSUPPORTED = 2;          // valid request, plugin/device cannot do it
  ERROR_DEVICE = 3;               // device rejected or misbehaved
  ERROR_DEVICE_DISCONNECTED = 4;
  ERROR_BUSY = 5;                 // acquisition in progress
  reserved 6;                     // was ERROR_NOT_OPEN
  ERROR_TIMEOUT = 7;
  ERROR_INTERNAL = 8;
}

// A front-panel trace colour, named rather than specified: a literal #RRGGBB
// that reads well on black is often unreadable on white, and only the frontend
// knows which theme it is drawing in.
//
// Unknown values decode to UNSPECIFIED, where the frontend falls back to its
// own scheme, so the list can be extended without breaking older frontends.
enum ChannelColor {
  CHANNEL_COLOR_UNSPECIFIED = 0;
  COLOR_YELLOW = 1;
  COLOR_MAGENTA = 2;
  COLOR_CYAN = 3;
  COLOR_GREEN = 4;
}
