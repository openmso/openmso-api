//
// The device model: what a device has, what values it accepts, and how it is
// configured. Carried by the Describe, GetConfig and SetConfig requests in
// capture.proto.

syntax = "proto3";

package omso.capture.v1;

import "common.proto";

// Authoritative for this connection, and re-queryable: on some devices,
// enabling a channel changes the available sample rates. DeviceInfo is not
// repeated here — HelloResult already reported it.
message Description {
  repeated Channel channels = 2;
  DeviceLimits limits = 3;
  AnalogLimits analog = 4;        // absent if the device has no analog channels
  LogicLimits logic = 5;          // absent if the device has no logic channels
  repeated VendorOption vendor_options = 6;
}

message Channel {
  string id = 1;                  // stable identifier, e.g. "C1", "D0"
  string name = 2;                // front-panel label
  ChannelKind kind = 3;
  uint32 index = 4;               // position within its kind, from 0

  // This model's front-panel colour, when the plugin knows it more precisely
  // than the manifest palette does. UNSPECIFIED falls back to the palette,
  // then to the frontend's own scheme.
  ChannelColor color = 5;
}

enum ChannelKind {
  CHANNEL_KIND_UNSPECIFIED = 0;
  CHANNEL_ANALOG = 1;
  CHANNEL_LOGIC = 2;
}

message DeviceLimits {
  DoubleSet samplerate = 1;       // Sa/s
  UintSet sample_depth = 2;       // samples per acquisition
  bool samplerate_settable = 3;   // false => derived; the frontend may only read
  bool sample_depth_settable = 4;
  UintSet averaging = 5;
  bool trigger_position = 6;      // pre-trigger positioning supported
  uint32 max_enabled_channels = 7; // 0 = no aggregate limit
}

message AnalogLimits {
  DoubleSet full_scale = 1;       // volts across the whole vertical range
  DoubleRange offset = 2;         // volts
  repeated Coupling couplings = 3;
  DoubleSet probe_factors = 4;
  DoubleSet impedances = 5;       // ohms
  bool bandwidth_limit = 6;
  bool invert = 7;
  // Grid divisions, so a frontend can render a graticule and label full_scale
  // as volts/div. 0 for devices with no grid concept.
  uint32 vertical_divisions = 8;
}

message LogicLimits {
  DoubleSet thresholds = 1;       // volts; empty => fixed threshold
}

// Settings this plugin understands that the schema above does not cover.
// Outside the core contract: a frontend may surface these as a generic
// key/value panel, and must work correctly while ignoring them.
message VendorOption {
  string key = 1;
  string description = 2;
  repeated string values = 3;     // empty => free-form string
}

// A permitted set of values: an explicit list of steps, or a range, never
// both. Empty means the setting is not adjustable.
message DoubleSet {
  repeated double values = 1;     // ascending
  DoubleRange range = 2;
}

message DoubleRange {
  double min = 1;
  double max = 2;
  double step = 3;                // 0 = continuous
}

message UintSet {
  repeated uint64 values = 1;     // ascending
  UintRange range = 2;
}

message UintRange {
  uint64 min = 1;
  uint64 max = 2;
  uint64 step = 3;
}

// Used for GetConfig results, SetConfig requests, and SetConfig results. A
// SetConfig result reports the values the device actually settled on, which
// may differ from those requested: devices snap to legal steps.
message Config {
  DeviceConfig device = 1;
  repeated ChannelConfig channels = 2;
  map<string, string> vendor = 3;
}

message DeviceConfig {
  optional double samplerate = 1;   // Sa/s
  optional uint64 sample_depth = 2; // samples per acquisition
  Trigger trigger = 3;
  optional uint32 averaging = 4;

  // Read-only, present in results: sample_depth / samplerate. The frontend's
  // timebase knob computes a rate and a depth; the protocol never takes a
  // seconds-per-division setting.
  optional double capture_span = 10;
}

message ChannelConfig {
  string id = 1;
  optional bool enabled = 2;

  // Analog only.
  optional double probe_factor = 3;
  optional double full_scale = 4;   // volts across the whole vertical range
  optional double offset = 5;       // volts at vertical centre
  optional Coupling coupling = 6;
  optional double impedance = 7;    // ohms
  optional bool bandwidth_limit = 8;
  optional bool invert = 9;

  // Logic only.
  optional double threshold = 20;   // volts
}

enum Coupling {
  COUPLING_UNSPECIFIED = 0;
  COUPLING_DC = 1;
  COUPLING_AC = 2;
  COUPLING_GND = 3;
}

message Trigger {
  oneof trigger {
    Empty none = 1;               // free-run: acquire immediately
    EdgeTrigger edge = 2;
    PulseTrigger pulse = 3;
    PatternTrigger pattern = 4;
  }

  // Fraction of sample_depth captured before the trigger instant, 0.0 to 1.0.
  double position = 10;
}

enum TriggerKind {
  TRIGGER_KIND_UNSPECIFIED = 0;
  TRIGGER_NONE = 1;
  TRIGGER_EDGE = 2;
  TRIGGER_PULSE = 3;
  TRIGGER_PATTERN = 4;
}

message EdgeTrigger {
  string channel = 1;
  Slope slope = 2;
  double level = 3;               // volts; ignored on logic channels
}

message PulseTrigger {
  string channel = 1;
  Slope slope = 2;                // polarity of the pulse
  double level = 3;               // volts; ignored on logic channels
  Comparison comparison = 4;
  double width = 5;               // seconds
  double width_max = 6;           // seconds; only for COMPARISON_WITHIN
}

// Fires when every listed channel simultaneously matches. Channels omitted
// from bits are don't-care.
message PatternTrigger {
  repeated PatternBit bits = 1;
}

message PatternBit {
  string channel = 1;
  BitMatch match = 2;
}

enum Slope {
  SLOPE_UNSPECIFIED = 0;
  SLOPE_RISING = 1;
  SLOPE_FALLING = 2;
  SLOPE_EITHER = 3;
}

enum Comparison {
  COMPARISON_UNSPECIFIED = 0;
  COMPARISON_LESS = 1;
  COMPARISON_GREATER = 2;
  COMPARISON_WITHIN = 3;
}

enum BitMatch {
  BIT_MATCH_UNSPECIFIED = 0;
  BIT_LOW = 1;
  BIT_HIGH = 2;
  BIT_RISING = 3;
  BIT_FALLING = 4;
  BIT_EITHER = 5;
}
