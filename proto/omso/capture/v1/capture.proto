// SPDX-License-Identifier: Apache-2.0
//
// OpenMSO Capture Protocol (OCP) v1 — DRAFT.
//
// Normative schema, and the entry point: importing this file also brings in
// the device model (device.proto) and the data plane (stream.proto).
//
// Frontends and plugins exchange these messages over nng: Request/Response on
// a REQ/REP control socket, Event on a PUSH/PULL stream socket.

syntax = "proto3";

package omso.capture.v1;

import public "common.proto";
import public "device.proto";
import public "stream.proto";

message Request {
  // Echoed in the Response. Debugging aid only: nng matches request to reply.
  uint32 seq = 1;

  oneof request {
    Hello        hello         = 10;
    Describe     describe      = 11;
    GetConfig    get_config    = 12;
    SetConfig    set_config    = 13;
    AcquireStart acquire_start = 14;
    AcquireStop  acquire_stop  = 15;
    Reset        reset         = 16;
    Shutdown     shutdown      = 17;
  }
}

message Response {
  uint32 seq = 1;

  // Set on failure, in which case the oneof below is empty.
  Error error = 2;

  oneof response {
    HelloResult  hello         = 10;
    Description  describe      = 11;
    Config       get_config    = 12;
    Config       set_config    = 13;
    Empty        acquire_start = 14;
    Empty        acquire_stop  = 15;
    Empty        reset         = 16;
    Empty        shutdown      = 17;
  }
}

// First and only handshake. The device to drive was named by the --device URL
// on the command line; the plugin connects to it while answering this request,
// so a device that is absent, busy or unreachable comes back as a normal Error
// rather than as a process that died with a message on stderr.
message Hello {
  uint32 protocol = 1;            // OCP major version the client speaks; 1 here
  string client_name = 2;
  string client_version = 3;

  // Everything the client can decode. The plugin picks from the intersection
  // with its own support and reports the result in HelloResult.
  repeated SampleEncoding accept_encodings = 4;
  repeated Codec accept_codecs = 5;
}

message HelloResult {
  uint32 protocol = 1;
  PluginInfo plugin = 2;
  Capabilities capabilities = 3;

  // What the plugin found at the far end of the --device URL. For a plugin
  // covering a family, this is where the specific model is resolved: the
  // manifest only claimed the device might be handled, this reports what it
  // actually is.
  DeviceInfo device = 6;

  // The negotiated intersection. A plugin MUST NOT emit an encoding or codec
  // absent from these lists. SAMPLE_ENCODING_PACKED and CODEC_NONE are
  // mandatory for both sides, so the intersection is never empty.
  repeated SampleEncoding encodings = 4;
  repeated Codec codecs = 5;
}

message PluginInfo {
  string name = 1;
  string version = 2;
  string vendor = 3;
  string description = 4;
}

message Capabilities {
  repeated AcquireMode modes = 1;
  repeated TriggerKind trigger_kinds = 2;
}

message DeviceInfo {
  string vendor = 1;
  string model = 2;
  string serial = 3;
  string firmware_version = 4;
}

message Shutdown {}

// Abort any acquisition and return to READY, discarding buffered data. The
// recovery path when a plugin reattaches to a device left mid-capture — a
// replacement plugin process after a crash, in particular.
message Reset {}

message Describe {}

message GetConfig {}

message SetConfig {
  // Sparse: only fields present are applied. Application order within one
  // SetConfig is the field order declared in Config (probe_factor before
  // full_scale, so scaling is interpreted against the right probe).
  Config config = 1;
}

message AcquireStart {
  // Assigned by the frontend, unique within the connection. Client-assigned so
  // that events on the stream socket can never reference a capture the
  // frontend has not yet heard of, whatever order the two sockets deliver in.
  uint64 capture_id = 1;
  AcquireMode mode = 2;
}

message AcquireStop {
  uint64 capture_id = 1;
}

enum AcquireMode {
  ACQUIRE_MODE_UNSPECIFIED = 0;

  // Arm, wait for the trigger, transfer one acquisition, end the capture.
  ACQUIRE_SINGLE = 1;

  // Acquisitions repeat until AcquireStop. A streaming device emits one
  // unbounded acquisition; a triggered scope emits one per trigger.
  ACQUIRE_CONTINUOUS = 2;

  // Transfer whatever the device currently holds without re-arming, then
  // restore its previous run state. For bench instruments already running.
  ACQUIRE_SNAPSHOT = 3;
}
