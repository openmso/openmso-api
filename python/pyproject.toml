# SPDX-License-Identifier: Apache-2.0
[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "openmso"
version = "0.1.0"
description = "OpenMSO Capture Protocol (OCP): framing, CaptureServer, CaptureClient"
requires-python = ">=3.8"
license = "Apache-2.0"

[tool.setuptools.packages.find]
include = ["openmso*"]
